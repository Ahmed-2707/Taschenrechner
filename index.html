<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Taschenrechner</title>
<style>* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;

    background:
        linear-gradient(rgba(3, 10, 20, 0.75), rgba(3, 10, 20, 0.85)),
        url("https://ddragon.leagueoflegends.com/cdn/img/champion/splash/Ahri_0.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.rechner {
    position: relative;
    width: 360px;
    padding: 25px;
    background: rgba(10, 20, 35, 0.92);

    border: 4px solid #c89b3c;
    border-radius: 20px;

    box-shadow:
        0 0 5px #fff3c4,
        0 0 15px #c89b3c,
        0 0 35px rgba(200, 155, 60, 0.8),
        0 0 70px rgba(0, 150, 255, 0.3),
        inset 0 0 20px rgba(200, 155, 60, 0.15);
}

/* Obere linke Verzierung */
.rechner::before {
    content: "◆";
    position: absolute;
    top: -18px;
    left: -18px;

    color: #f0c75e;
    font-size: 32px;

    text-shadow:
        0 0 5px #fff3c4,
        0 0 15px #c89b3c;
}

/* Untere rechte Verzierung */
.rechner::after {
    content: "◆";
    position: absolute;
    bottom: -18px;
    right: -18px;

    color: #f0c75e;
    font-size: 32px;

    text-shadow:
        0 0 5px #fff3c4,
        0 0 15px #c89b3c;
}

h1 {
    text-align: center;
    color: #c89b3c;
    margin-top: 0;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-shadow: 0 0 10px #c89b3c;
}

#anzeige {
    width: 100%;
    height: 75px;
    margin-bottom: 20px;
    padding: 15px;
    border: 2px solid #c89b3c;
    border-radius: 10px;
    background: #020812;
    color: #f0e6d2;
    font-size: 32px;
    text-align: right;

    box-shadow: inset 0 0 15px rgba(0, 170, 255, 0.3);
}

.tasten {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}
.tasten button:nth-child(1) {
    grid-column: 1;
    grid-row: 1;
}

.tasten button:nth-child(2) {
    grid-column: 2;
    grid-row: 1;
}

.tasten button:nth-child(3) {
    grid-column: 3;
    grid-row: 1;
}

.tasten button:nth-child(4) {
    grid-column: 4;
    grid-row: 1;
}

.tasten button:nth-child(5) {
    grid-column: 1;
    grid-row: 2;
}

.tasten button:nth-child(6) {
    grid-column: 2;
    grid-row: 2;
}

.tasten button:nth-child(7) {
    grid-column: 3;
    grid-row: 2;
}

.tasten button:nth-child(8) {
    grid-column: 4;
    grid-row: 2;
}

.tasten button:nth-child(9) {
    grid-column: 1;
    grid-row: 3;
}

.tasten button:nth-child(10) {
    grid-column: 2;
    grid-row: 3;
}

.tasten button:nth-child(11) {
    grid-column: 3;
    grid-row: 3;
}

.tasten button:nth-child(12) {
    grid-column: 4;
    grid-row: 3 / span 2;
    height: 152px;
}

.tasten button:nth-child(13) {
    grid-column: 1;
    grid-row: 4;
}

.tasten button:nth-child(14) {
    grid-column: 2;
    grid-row: 4;
}

.tasten button:nth-child(15) {
    grid-column: 3;
    grid-row: 4;
}

.tasten button:nth-child(16) {
    grid-column: 1;
    grid-row: 5;
}

.tasten button:nth-child(17) {
    grid-column: 2;
    grid-row: 5;
}

button {
    height: 60px;
    border: 1px solid #785a28;
    border-radius: 10px;

    background: linear-gradient(145deg, #172b3a, #0a1428);

    color: #f0e6d2;
    font-size: 22px;
    cursor: pointer;
    transition: 0.2s;

    box-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
}

button:hover {
    transform: scale(1.07);
    border-color: #c89b3c;
    color: white;
    box-shadow: 0 0 15px #c89b3c;
}

.op {
    background: linear-gradient(145deg, #785a28, #3c2b12);
    color: #f0e6d2;
    border-color: #c89b3c;
}

.op:hover {
    background: linear-gradient(145deg, #c89b3c, #785a28);
}

.gleich {
    background: linear-gradient(145deg, #c89b3c, #785a28);
    color: #020812;
    font-weight: bold;
}

.gleich:hover {
    background: #f0e6d2;
    box-shadow: 0 0 25px #c89b3c;
}

.clear {
    background: linear-gradient(145deg, #8b1e1e, #3b0808);
    border-color: #e74c3c;
}

.clear:hover {
    background: #c0392b;
    box-shadow: 0 0 15px #e74c3c;
/* ================================
   LOL – GOLDENER ORNAMENT-RAHMEN
   ================================ */

.rechner {
    position: relative;

    border: 3px solid #c89b3c;
    border-radius: 20px;

    box-shadow:
        0 0 5px #f0e6d2,
        0 0 15px #c89b3c,
        0 0 35px rgba(200, 155, 60, 0.8),
        0 0 70px rgba(0, 120, 255, 0.3),
        inset 0 0 20px rgba(200, 155, 60, 0.12);
}


/* ================================
   VERZIERTE GOLDENE ECKEN
   ================================ */

.rechner::before,
.rechner::after {
    content: "";
    position: absolute;

    width: 55px;
    height: 55px;

    pointer-events: none;
}


/* Oben links */
.rechner::before {
    top: -8px;
    left: -8px;

    border-top: 5px solid #f0c75e;
    border-left: 5px solid #f0c75e;

    border-radius: 18px 0 0 0;

    box-shadow:
        -2px -2px 8px #c89b3c,
        inset 8px 8px 12px rgba(255, 220, 120, 0.3);
}


/* Unten rechts */
.rechner::after {
    bottom: -8px;
    right: -8px;

    border-bottom: 5px solid #f0c75e;
    border-right: 5px solid #f0c75e;

    border-radius: 0 0 18px 0;

    box-shadow:
        2px 2px 8px #c89b3c,
        inset -8px -8px 12px rgba(255, 220, 120, 0.3);
}
</style>
</head>
<body>

    <div class="rechner">

        <input type="text" id="anzeige" value="" readonly>

        <div class="tasten">

            <button onclick="loeschen()">C</button>
            <button onclick="eingabe('/') " class="op">/</button>
            <button onclick="eingabe('*')" class="op">*</button>
            <button onclick="eingabe('-')" class="op">-</button>

            <button onclick="eingabe('7')">7</button>
            <button onclick="eingabe('8')">8</button>
            <button onclick="eingabe('9')">9</button>
            <button onclick="eingabe('+')" class="op">+</button>

            <button onclick="eingabe('4')">4</button>
            <button onclick="eingabe('5')">5</button>
            <button onclick="eingabe('6')">6</button>
            <button onclick="berechne()" class="op gleich">=</button>

            <button onclick="eingabe('1')">1</button>
            <button onclick="eingabe('2')">2</button>
            <button onclick="eingabe('3')">3</button>

            <button onclick="eingabe('0')" class="null">0</button>
            <button onclick="eingabe('.')">.</button>

        </div>

    </div>

    <script src="renderer.js"></script>

</body>
</html>
